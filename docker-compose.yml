name: coder
x-app: &app
  build: ./backend
  env_file: .env
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://${DB_USER:-coders}:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/${DB_NAME:-coders_db}
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    JUDGE0_URL: ${JUDGE0_URL:?Configure an isolated Judge0 endpoint}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  db:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-coders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-coders_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coders} -d ${DB_NAME:-coders_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  api:
    <<: *app
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/workerHealth.js"]
      interval: 15s
      timeout: 5s
      retries: 4
  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
