################################################################################
# Judge0 Configuration
################################################################################

# Redis
REDIS_HOST=judge0-redis
REDIS_PORT=6379

# PostgreSQL
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_secret

# Judge0 Settings
RAILS_ENV=production
SECRET_KEY_BASE=change_this_secret_key_base_in_production
# Suppress Rails SQL debug logs — only warn and above in production
RAILS_LOG_LEVEL=warn

# Execution Settings
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=512000
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_FILE_SIZE=1024
NUMBER_OF_RUNS=1

# Workers
INTERVAL=0.1
COUNT=10